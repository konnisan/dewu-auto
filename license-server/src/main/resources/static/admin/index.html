<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dewu Auto 卡密管理</title>
<style>
:root{--bg:#f5f7f7;--card:#fff;--text:#172023;--muted:#748187;--line:#e2e7e9;--brand:#0a9396;--brand-soft:#e9f7f6;--danger:#b44f58;--warn:#9c6b16}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(390px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 12px 36px rgba(33,53,58,.08)}.login-card h1{font-size:24px;margin:0 0 8px}.login-card p{color:var(--muted);font-size:13px;margin:0 0 22px}.input{width:100%;height:46px;border:1px solid #d8e0e2;border-radius:10px;padding:0 12px;outline:none;background:#fff}.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,147,150,.08)}.btn{border:0;border-radius:10px;height:42px;padding:0 14px;background:var(--brand);color:white;font-weight:800;cursor:pointer}.btn.secondary{background:#edf2f3;color:#425156}.btn.danger{background:#f8e9eb;color:var(--danger)}.btn.warn{background:#f7f0df;color:var(--warn)}.btn:disabled{opacity:.55;cursor:not-allowed}.login-btn{width:100%;height:46px;margin-top:12px}.error{color:var(--danger);font-size:13px;margin-top:10px;display:none}.error.show{display:block}.top{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:850}.top-right{display:flex;align-items:center;gap:10px}.status{font-size:12px;color:var(--muted)}.wrap{max-width:1120px;margin:32px auto;padding:0 18px 48px}.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 8px 24px rgba(33,53,58,.04)}.card h2{font-size:17px;margin:0 0 16px}.label{font-size:12px;font-weight:800;margin:14px 0 7px}.help{font-size:12px;color:var(--muted);margin-top:7px}.create-btn{width:100%;margin-top:18px}.generated{margin-top:16px;background:#111a1d;color:#e2fffb;border-radius:11px;padding:14px;display:none}.generated.show{display:block}.generated small{display:block;color:#8fa7a6;margin-bottom:6px}.key{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:850;word-break:break-all}.copy-btn{margin-top:10px;background:white;color:#08777a;height:34px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.stat small{color:var(--muted)}.stat b{display:block;font-size:24px;margin-top:5px}.table-card{padding:0;overflow:hidden}.table-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.table-head h2{margin:0}.search{width:250px;height:40px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:850px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;color:var(--muted);background:#fafcfc}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.badge.active{background:#eaf8f2;color:#247a59}.badge.disabled{background:#faecee;color:#a74852}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{height:32px;padding:0 10px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:38px!important}.toast{position:fixed;right:18px;bottom:18px;background:#172023;color:white;border-radius:10px;padding:11px 14px;font-size:13px;display:none;z-index:20}.toast.show{display:block}.device{max-width:150px;display:inline-block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}.muted{color:var(--muted)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.top{padding:0 14px}.wrap{margin:20px auto}.search{width:180px}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.table-head{align-items:flex-start;flex-direction:column}.search{width:100%}}
</style>
</head>
<body>
<section id="loginView" class="login-wrap">
  <div class="login-card">
    <h1>Dewu Auto 卡密管理</h1>
    <p>私人管理入口。登录后生成卡密并复制发送给使用者。</p>
    <input id="password" class="input" type="password" autocomplete="current-password" placeholder="管理密码">
    <button id="loginBtn" class="btn login-btn">登录</button>
    <div id="loginError" class="error"></div>
  </div>
</section>

<section id="appView" class="hidden">
  <header class="top">
    <div class="brand">Dewu Auto 卡密管理</div>
    <div class="top-right"><span id="serverStatus" class="status">已连接</span><button id="logoutBtn" class="btn secondary">退出</button></div>
  </header>
  <main class="wrap">
    <div class="stats">
      <div class="stat"><small>全部卡密</small><b id="countAll">0</b></div>
      <div class="stat"><small>启用</small><b id="countActive">0</b></div>
      <div class="stat"><small>已绑定设备</small><b id="countBound">0</b></div>
      <div class="stat"><small>在线会话</small><b id="countSessions">0</b></div>
    </div>
    <div class="grid">
      <div class="card">
        <h2>生成卡密</h2>
        <div class="label">有效期</div>
        <select id="daysSelect" class="input">
          <option value="1">1 天</option>
          <option value="7">7 天</option>
          <option value="30" selected>30 天</option>
          <option value="90">90 天</option>
          <option value="365">365 天</option>
          <option value="0">永久</option>
        </select>
        <div class="help">卡密创建后立即开始计算有效期。</div>
        <button id="createBtn" class="btn create-btn">生成卡密</button>
        <div id="generated" class="generated">
          <small>新生成卡密</small>
          <div id="generatedKey" class="key">--</div>
          <button id="copyGenerated" class="btn copy-btn">复制卡密</button>
        </div>
      </div>
      <div class="card table-card">
        <div class="table-head">
          <div><h2>卡密列表</h2><div id="lastRefresh" class="help">尚未刷新</div></div>
          <div style="display:flex;gap:8px"><input id="searchInput" class="input search" placeholder="搜索卡密 / 设备"><button id="refreshBtn" class="btn secondary">刷新</button></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>卡密</th><th>状态</th><th>设备</th><th>到期时间</th><th>会话</th><th>操作</th></tr></thead>
            <tbody id="tbody"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</section>
<div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);let licenses=[];let adminToken=sessionStorage.getItem('dewuAdminToken')||'';const API='api';
function toast(msg){const el=$('toast');el.textContent=msg;el.className='toast show';clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.className='toast',1800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function request(path,opt={},auth=true){const headers={...(opt.headers||{})};if(opt.body)headers['Content-Type']='application/json';if(auth&&adminToken)headers.Authorization='Bearer '+adminToken;const r=await fetch(`${API}/${path}`,{...opt,headers});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.detail||d?.message||`HTTP ${r.status}`);return d}
function legacyCopy(text){const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}document.body.removeChild(t);return ok}
async function copyText(text){let ok=false;if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);ok=true}catch{}}if(!ok)ok=legacyCopy(text);toast(ok?'已复制卡密':'复制失败')}
function fmt(v){return v?esc(String(v).replace('T',' ')):'永久'}
function shortDevice(v){if(!v)return '<span class="muted">未绑定</span>';const s=String(v);return `<span class="device" title="${esc(s)}">${esc(s.length>18?s.slice(0,8)+'…'+s.slice(-6):s)}</span>`}
function render(){const q=$('searchInput').value.trim().toLowerCase();const rows=licenses.filter(x=>!q||String(x.cardKey||'').toLowerCase().includes(q)||String(x.boundDeviceId||'').toLowerCase().includes(q));$('countAll').textContent=licenses.length;$('countActive').textContent=licenses.filter(x=>x.status==='ACTIVE').length;$('countBound').textContent=licenses.filter(x=>x.boundDeviceId).length;$('countSessions').textContent=licenses.reduce((n,x)=>n+Number(x.sessionCount||0),0);const tb=$('tbody');if(!rows.length){tb.innerHTML='<tr><td colspan="6" class="empty">没有卡密</td></tr>';return}tb.innerHTML=rows.map(x=>{const active=x.status==='ACTIVE';return `<tr><td><span class="key">${esc(x.cardKey)}</span></td><td><span class="badge ${active?'active':'disabled'}">${active?'启用':'禁用'}</span></td><td>${shortDevice(x.boundDeviceId)}</td><td>${fmt(x.expiresAt)}</td><td>${Number(x.sessionCount||0)}</td><td><div class="actions"><button class="btn secondary small" data-act="copy" data-key="${esc(x.cardKey)}">复制</button><button class="btn ${active?'danger':'secondary'} small" data-act="status" data-key="${esc(x.cardKey)}" data-status="${active?'DISABLED':'ACTIVE'}">${active?'禁用':'启用'}</button><button class="btn warn small" data-act="unbind" data-key="${esc(x.cardKey)}" ${x.boundDeviceId?'':'disabled'}>解绑</button></div></td></tr>`}).join('')}
async function load(){try{licenses=await request('licenses');$('lastRefresh').textContent='刷新时间 '+new Date().toLocaleString();$('serverStatus').textContent='已连接';render()}catch(e){if(/401|密码/.test(e.message)){logout();return}$('serverStatus').textContent='连接异常';toast(e.message)}}
async function login(){const password=$('password').value.trim();if(!password){$('loginError').textContent='请输入管理密码';$('loginError').classList.add('show');return}$('loginBtn').disabled=true;try{await request('login',{method:'POST',body:JSON.stringify({password})},false);adminToken=password;sessionStorage.setItem('dewuAdminToken',adminToken);$('loginError').classList.remove('show');$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await load()}catch(e){$('loginError').textContent=e.message||'登录失败';$('loginError').classList.add('show')}finally{$('loginBtn').disabled=false}}
function logout(){adminToken='';sessionStorage.removeItem('dewuAdminToken');$('password').value='';$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')}
$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logoutBtn').onclick=logout;$('refreshBtn').onclick=load;$('searchInput').oninput=render;
$('createBtn').onclick=async()=>{const days=Number($('daysSelect').value);$('createBtn').disabled=true;try{const d=await request('licenses',{method:'POST',body:JSON.stringify({days})});$('generatedKey').textContent=d.cardKey;$('generated').classList.add('show');toast('卡密已生成');await load()}catch(e){toast(e.message)}finally{$('createBtn').disabled=false}};
$('copyGenerated').onclick=()=>copyText($('generatedKey').textContent);
$('tbody').onclick=async e=>{const b=e.target.closest('button[data-act]');if(!b)return;const key=b.dataset.key;try{if(b.dataset.act==='copy'){await copyText(key);return}if(b.dataset.act==='status'){await request('licenses/'+encodeURIComponent(key)+'/status',{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});toast(b.dataset.status==='ACTIVE'?'已启用':'已禁用')}if(b.dataset.act==='unbind'){if(!confirm('确认解绑 '+key+' 的设备？'))return;await request('licenses/'+encodeURIComponent(key)+'/unbind',{method:'POST'});toast('设备已解绑')}await load()}catch(err){toast(err.message)}};
if(adminToken){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');load()}
</script>
</body>
</html>
