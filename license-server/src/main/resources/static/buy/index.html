<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dewu Auto 授权购买</title>
  <style>
    :root{--bg:#f5f7f8;--card:#fff;--text:#14191c;--muted:#69757b;--line:#dce3e6;--accent:#0a8f8a;--accent2:#e7f6f4;--danger:#bc3c45}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef8f7,#f5f7f8 40%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:min(92vw,520px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 18px 55px rgba(28,54,61,.12)}
    .brand{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.08em}.title{font-size:28px;font-weight:800;margin:10px 0 4px}.sub{color:var(--muted);font-size:14px;line-height:1.7}.price{font-size:42px;font-weight:850;margin:26px 0 6px}.price small{font-size:18px}.meta{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px}.meta .k{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}.status{margin-top:18px;padding:14px 16px;border-radius:12px;background:#f3f6f7;color:#4f5d63;font-size:14px}.status.ok{background:var(--accent2);color:#08756f}.status.error{background:#fff0f1;color:var(--danger)}button{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px 16px;background:var(--accent);color:white;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.card-key{display:none;margin-top:18px;padding:18px;border-radius:14px;background:#101820;color:#eafffc}.card-key.show{display:block}.card-key .label{font-size:12px;color:#8fb2af;margin-bottom:8px}.card-key .value{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:18px;font-weight:800;word-break:break-all}.tip{margin-top:16px;color:#8a969b;font-size:12px;line-height:1.7}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">DEWU AUTO</div>
    <div class="title">授权订单</div>
    <div class="sub">这是测试支付页。当前阶段不会发起真实扣款，用于验证“网页支付 → 服务端发卡 → APK 轮询拿卡”的完整链路。</div>

    <div class="price"><small>¥</small><span id="price">--</span></div>

    <div class="meta">
      <div class="k">订单号</div><div id="orderNo" class="mono">--</div>
      <div class="k">授权时长</div><div id="plan">--</div>
      <div class="k">订单状态</div><div id="state">--</div>
      <div class="k">有效截止</div><div id="expires">--</div>
    </div>

    <div id="statusBox" class="status">正在读取订单…</div>
    <button id="payBtn" disabled>模拟支付成功（测试）</button>

    <div id="cardBox" class="card-key">
      <div class="label">已生成卡密</div>
      <div id="cardKey" class="value"></div>
    </div>

    <div class="tip">支付成功后 APK 会在下一次轮询时自动取得卡密。正式接入支付宝/微信时，此按钮会替换为真实支付流程，卡密仍只由服务端在支付确认后生成。</div>
  </main>

<script>
  const qs=new URLSearchParams(location.search);const orderNo=qs.get('orderNo')||'';const token=qs.get('token')||'';
  const $=id=>document.getElementById(id);let timer=null;
  $('orderNo').textContent=orderNo||'缺少订单号';
  const endpoint=suffix=>`../orders/${encodeURIComponent(orderNo)}${suffix||''}`;
  function formatPlan(days){return Number(days)===0?'永久授权':`${days} 天授权`}
  function setStatus(text,type=''){const el=$('statusBox');el.textContent=text;el.className='status'+(type?' '+type:'')}
  function render(d){
    $('price').textContent=(Number(d.amountFen||0)/100).toFixed(2);$('plan').textContent=formatPlan(d.planDays);$('state').textContent=d.status||'--';$('expires').textContent=(d.expiresAt||'--').replace('T',' ');
    const paid=d.status==='PAID';const active=d.status==='CREATED';$('payBtn').disabled=!active;
    if(paid){setStatus('支付成功，卡密已经生成。APK 正在通过轮询获取卡密。','ok');$('cardKey').textContent=d.cardKey||'';$('cardBox').className='card-key show';clearInterval(timer)}
    else if(active){setStatus('等待支付。点击下方按钮即可模拟第三方支付回调。');$('cardBox').className='card-key'}
    else{setStatus(`订单当前状态：${d.status}`,'error');$('cardBox').className='card-key';clearInterval(timer)}
  }
  async function load(){
    if(!orderNo||!token){setStatus('链接无效：缺少 orderNo 或 token。','error');return}
    try{const r=await fetch(endpoint(`?token=${encodeURIComponent(token)}`),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.detail||d.message||`HTTP ${r.status}`);render(d)}catch(e){setStatus(e.message||'读取订单失败','error')}
  }
  $('payBtn').onclick=async()=>{
    $('payBtn').disabled=true;setStatus('正在模拟支付回调…');
    try{const r=await fetch(endpoint('/mock-pay'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientToken:token})});const d=await r.json();if(!r.ok)throw new Error(d.detail||d.message||`HTTP ${r.status}`);render(d)}catch(e){setStatus(e.message||'支付失败','error');$('payBtn').disabled=false}
  };
  load();timer=setInterval(load,2000);
</script>
</body>
</html>
