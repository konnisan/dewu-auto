<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dewu Auto 卡密购买</title>
  <style>
    :root{--bg:#f5f7f8;--card:#fff;--text:#14191c;--muted:#69757b;--line:#dce3e6;--accent:#0a8f8a;--accent2:#e7f6f4;--danger:#bc3c45}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef8f7,#f5f7f8 40%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:min(94vw,560px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 18px 55px rgba(28,54,61,.12)}
    .brand{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.08em}.title{font-size:28px;font-weight:800;margin:10px 0 4px}.sub{color:var(--muted);font-size:14px;line-height:1.7}
    .plans{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0}.plan{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;cursor:pointer;text-align:left}.plan.active{border-color:var(--accent);background:var(--accent2)}.plan b{display:block;font-size:16px}.plan span{display:block;margin-top:5px;color:var(--muted);font-size:13px}
    .price{font-size:42px;font-weight:850;margin:18px 0 6px}.price small{font-size:18px}.meta{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px}.meta .k{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}.status{margin-top:18px;padding:14px 16px;border-radius:12px;background:#f3f6f7;color:#4f5d63;font-size:14px}.status.ok{background:var(--accent2);color:#08756f}.status.error{background:#fff0f1;color:var(--danger)}button{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px 16px;background:var(--accent);color:white;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.card-key{display:none;margin-top:18px;padding:18px;border-radius:14px;background:#101820;color:#eafffc}.card-key.show{display:block}.card-key .label{font-size:12px;color:#8fb2af;margin-bottom:8px}.card-key .value{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:18px;font-weight:800;word-break:break-all}.tip{margin-top:16px;color:#8a969b;font-size:12px;line-height:1.7}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">DEWU AUTO</div>
    <div class="title">购买卡密</div>
    <div class="sub">选择授权套餐后创建订单。当前仍是测试支付，不会真实扣款；支付成功后网页直接显示卡密，复制到 APK 的“卡密”输入框即可。</div>

    <div id="planArea" class="plans">
      <button class="plan" data-days="7" data-price="3.00"><b>7 天</b><span>¥3.00</span></button>
      <button class="plan active" data-days="30" data-price="9.00"><b>30 天</b><span>¥9.00</span></button>
      <button class="plan" data-days="365" data-price="49.90"><b>365 天</b><span>¥49.90</span></button>
      <button class="plan" data-days="0" data-price="99.90"><b>永久</b><span>¥99.90</span></button>
    </div>

    <div class="price"><small>¥</small><span id="price">9.00</span></div>

    <div class="meta">
      <div class="k">订单号</div><div id="orderNo" class="mono">尚未创建</div>
      <div class="k">授权时长</div><div id="plan">30 天授权</div>
      <div class="k">订单状态</div><div id="state">--</div>
      <div class="k">有效截止</div><div id="expires">--</div>
    </div>

    <div id="statusBox" class="status">选择套餐后创建订单。</div>
    <button id="createBtn">创建测试订单</button>
    <button id="payBtn" style="display:none" disabled>模拟支付成功（测试）</button>

    <div id="cardBox" class="card-key">
      <div class="label">卡密</div>
      <div id="cardKey" class="value"></div>
    </div>

    <div class="tip">正式接入支付宝/微信后，只替换支付确认部分；卡密依然由服务端在确认收款后生成。APK 不参与创建订单，也不会轮询支付状态。</div>
  </main>

<script>
  const $=id=>document.getElementById(id);
  const qs=new URLSearchParams(location.search);
  let orderNo=qs.get('orderNo')||'';
  let token=qs.get('token')||'';
  let selectedDays=30;
  let timer=null;

  const endpoint=suffix=>`../orders/${encodeURIComponent(orderNo)}${suffix||''}`;
  const createEndpoint='../orders';
  function formatPlan(days){return Number(days)===0?'永久授权':`${days} 天授权`}
  function setStatus(text,type=''){const el=$('statusBox');el.textContent=text;el.className='status'+(type?' '+type:'')}
  function setPlanUi(days,price){selectedDays=Number(days);$('price').textContent=Number(price).toFixed(2);$('plan').textContent=formatPlan(selectedDays);document.querySelectorAll('.plan').forEach(el=>el.classList.toggle('active',Number(el.dataset.days)===selectedDays))}

  document.querySelectorAll('.plan').forEach(el=>{
    el.onclick=()=>{if(orderNo)return;setPlanUi(el.dataset.days,el.dataset.price)};
  });

  function render(d){
    $('orderNo').textContent=d.orderNo||orderNo||'--';
    $('price').textContent=(Number(d.amountFen||0)/100).toFixed(2);
    $('plan').textContent=formatPlan(d.planDays);
    $('state').textContent=d.status||'--';
    $('expires').textContent=(d.expiresAt||'--').replace('T',' ');
    const paid=d.status==='PAID';
    const active=d.status==='CREATED';
    $('createBtn').style.display='none';
    $('planArea').style.pointerEvents='none';
    $('payBtn').style.display=paid?'none':'block';
    $('payBtn').disabled=!active;
    if(paid){
      setStatus('支付成功，卡密已经生成。请复制卡密并填写到 APK。','ok');
      $('cardKey').textContent=d.cardKey||'';
      $('cardBox').className='card-key show';
      clearInterval(timer);
    }else if(active){
      setStatus('订单已创建。点击下方按钮模拟支付成功。');
      $('cardBox').className='card-key';
    }else{
      setStatus(`订单当前状态：${d.status}`,'error');
      $('cardBox').className='card-key';
      clearInterval(timer);
    }
  }

  async function load(){
    if(!orderNo||!token)return;
    try{
      const r=await fetch(endpoint(`?token=${encodeURIComponent(token)}`),{cache:'no-store'});
      const d=await r.json();
      if(!r.ok)throw new Error(d.detail||d.message||`HTTP ${r.status}`);
      render(d);
    }catch(e){setStatus(e.message||'读取订单失败','error')}
  }

  $('createBtn').onclick=async()=>{
    $('createBtn').disabled=true;
    setStatus('正在创建订单…');
    const deviceId=`web-${crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2)}`;
    try{
      const r=await fetch(createEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId,planDays:selectedDays})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.detail||d.message||`HTTP ${r.status}`);
      orderNo=d.orderNo;token=d.clientToken;
      history.replaceState(null,'',`?orderNo=${encodeURIComponent(orderNo)}&token=${encodeURIComponent(token)}`);
      render(d);
      timer=setInterval(load,2000);
    }catch(e){setStatus(e.message||'创建订单失败','error');$('createBtn').disabled=false}
  };

  $('payBtn').onclick=async()=>{
    $('payBtn').disabled=true;
    setStatus('正在模拟支付回调…');
    try{
      const r=await fetch(endpoint('/mock-pay'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientToken:token})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.detail||d.message||`HTTP ${r.status}`);
      render(d);
    }catch(e){setStatus(e.message||'支付失败','error');$('payBtn').disabled=false}
  };

  if(orderNo&&token){
    $('createBtn').style.display='none';
    $('payBtn').style.display='block';
    load();
    timer=setInterval(load,2000);
  }
</script>
</body>
</html>
