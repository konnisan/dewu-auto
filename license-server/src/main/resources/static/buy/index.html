<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dewu Auto 卡密</title>
<style>
:root{--bg:#f5f7f7;--card:#fff;--text:#161b1d;--muted:#7a8589;--line:#e2e7e9;--brand:#0a9396;--brand-soft:#e9f7f6;--danger:#b54b53;--ali:#1677ff;--wx:#07c160}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:850}.tabs{display:flex;gap:6px}.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer}.tabs button.active{background:var(--brand-soft);color:#08777a;font-weight:800}.wrap{max-width:620px;margin:48px auto;padding:0 16px}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 10px 32px rgba(33,53,58,.06)}h1{font-size:24px;margin:0 0 22px}.label{font-size:13px;font-weight:800;margin:20px 0 8px}.product{border:2px solid var(--brand);background:var(--brand-soft);border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center}.product b{font-size:17px}.product small{display:block;color:var(--muted);margin-top:4px}.price{font-size:25px;font-weight:900}.future{margin-top:8px;border:1px dashed #cbd5d8;border-radius:10px;padding:10px 12px;color:#98a1a5;font-size:12px}.input{width:100%;height:46px;border:1px solid #d9e0e2;border-radius:10px;padding:0 12px;outline:none}.input:focus{border-color:var(--brand)}.help{margin-top:7px;color:var(--muted);font-size:12px}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pay button{height:50px;border:1px solid #d9e0e2;background:#fff;border-radius:10px;cursor:pointer;font-weight:750;display:flex;align-items:center;justify-content:center;gap:9px}.pay button.active{border:2px solid var(--brand);background:var(--brand-soft);color:#08777a}.payicon{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900}.payicon.ali{background:var(--ali)}.payicon.wx{background:var(--wx)}.submit{width:100%;height:48px;margin-top:22px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:850;cursor:pointer}.submit:disabled{opacity:.55}.query-row{display:grid;grid-template-columns:1fr auto;gap:8px}.query-row button{border:0;border-radius:10px;background:var(--brand);color:white;padding:0 18px;font-weight:800;cursor:pointer}.error{display:none;margin-top:14px;color:var(--danger);font-size:13px}.error.show{display:block}.results{display:none;margin-top:18px}.results.show{display:block}.order{border-top:1px solid var(--line);padding:18px 0}.order:first-child{border-top:0;padding-top:0}.order-line{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:13px}.order-line span:first-child{color:var(--muted)}.status{font-weight:800}.status.paid{color:#08777a}.status.created{color:#9a7612}.status.expired{color:#a14f56}.keyrow{margin-top:10px;background:#111a1d;color:#ddfffb;border-radius:10px;padding:14px}.keyitem+.keyitem{border-top:1px solid #2a3b3f;margin-top:12px;padding-top:12px}.keyrow small{display:block;color:#8da3a2;margin-bottom:6px}.keyvalue{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:850;word-break:break-all}.copy{margin-top:9px;border:0;background:#fff;color:#0a7376;border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer}.copyall{width:100%;margin-top:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modal-card{width:min(440px,94vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;text-align:center}.modal-card h2{margin:0 0 8px;font-size:21px}.modal-method{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}.modal-method .payicon{width:28px;height:28px}.qr{width:170px;height:170px;margin:18px auto;background:repeating-linear-gradient(45deg,#111 0 7px,#fff 7px 14px);border:12px solid #fff;outline:1px solid var(--line)}.testpay{width:100%;height:44px;border:1px dashed #9fb4b3;background:#f7fbfb;border-radius:9px;color:#54706f;font-weight:800;cursor:pointer}.success{display:none}.success.show{display:block}.success .keyrow{text-align:left}.close{margin-top:10px;border:0;background:transparent;color:var(--muted);cursor:pointer}@media(max-width:640px){.wrap{margin:24px auto}.query-row{grid-template-columns:1fr}.query-row button{height:44px}.top{padding:0 14px}.brand{font-size:14px}}
</style>
</head>
<body>
<header class="top"><div class="brand">Dewu Auto 卡密</div><nav class="tabs"><button id="tabBuy" class="active">购买</button><button id="tabQuery">订单查询</button></nav></header>
<main class="wrap">
<section id="buyView" class="view active"><div class="card"><h1>购买卡密</h1><div class="product"><div><b>30 天卡密</b><small>支付成功后开始计时</small></div><div class="price">¥9.00</div></div><div class="future">更多套餐（暂未开放）</div><div class="label">手机号</div><input id="phone" class="input" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号" /><div class="help">用于查询该手机号下的全部订单和卡密。</div><div class="label">数量</div><input id="quantity" class="input" type="number" inputmode="numeric" min="1" max="50" value="1" /><div class="help">单次最多购买 50 张。</div><div class="label">支付方式</div><div class="pay"><button class="active" data-method="alipay"><span class="payicon ali">支</span><span>支付宝</span></button><button data-method="wechat"><span class="payicon wx">微</span><span>微信支付</span></button></div><button id="submit" class="submit">立即支付 ¥9.00</button></div></section>
<section id="queryView" class="view"><div class="card"><h1>订单查询</h1><div class="query-row"><input id="queryPhone" class="input" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入购买手机号" /><button id="querySubmit">查询</button></div><div class="help">查询该手机号下的全部订单。</div><div id="queryError" class="error"></div><div id="queryResult" class="results"></div></div></section>
</main>
<div id="modal" class="modal"><div class="modal-card"><div id="payState"><div class="modal-method"><span id="modalIcon" class="payicon ali">支</span><h2 id="payTitle">支付宝支付</h2></div><div id="modalAmount">¥9.00</div><div class="qr"></div><button id="simulate" class="testpay">模拟支付成功</button></div><div id="successState" class="success"><h2>支付成功</h2><div id="successKeys" class="keyrow"></div><button id="copyAll" class="copy copyall">复制全部卡密</button><button id="viewOrder" class="submit">查看订单</button></div><button id="close" class="close">关闭</button></div></div>
<script>
let method='alipay',currentOrder=null,currentPayment=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function view(q){$('#buyView').classList.toggle('active',!q);$('#queryView').classList.toggle('active',q);$('#tabBuy').classList.toggle('active',!q);$('#tabQuery').classList.toggle('active',q);history.replaceState(null,'',q?'#orders':'#buy')}
$('#tabBuy').onclick=()=>view(false);$('#tabQuery').onclick=()=>view(true);$$('.pay button').forEach(b=>b.onclick=()=>{$$('.pay button').forEach(x=>x.classList.remove('active'));b.classList.add('active');method=b.dataset.method});
async function json(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||d.message||`HTTP ${r.status}`);return d}
function quantity(){const n=Number($('#quantity').value);return Number.isInteger(n)&&n>=1&&n<=50?n:null}
function updateTotal(){const q=quantity();$('#submit').textContent=q?`立即支付 ¥${(q*9).toFixed(2)}`:'立即支付'}$('#quantity').oninput=updateTotal;
function setModalMethod(){const ali=method==='alipay';$('#payTitle').textContent=ali?'支付宝支付':'微信支付';$('#modalIcon').textContent=ali?'支':'微';$('#modalIcon').className='payicon '+(ali?'ali':'wx')}
$('#submit').onclick=async()=>{const phone=$('#phone').value.trim(),q=quantity();if(!/^1\d{10}$/.test(phone)){alert('请输入正确的 11 位手机号');return}if(!q){alert('购买数量必须在 1~50 之间');return}$('#submit').disabled=true;$('#submit').textContent='正在创建订单…';try{const order=await json('../orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,planDays:30,quantity:q})});currentOrder=order;$('#submit').textContent='正在创建支付…';const payment=await json('../payments/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNo:order.orderNo,clientToken:order.clientToken,method})});currentPayment=payment;if(payment.redirectUrl){location.href=payment.redirectUrl;return}setModalMethod();$('#modalAmount').textContent='¥'+(Number(payment.amountFen||order.amountFen||q*900)/100).toFixed(2);$('#payState').style.display='block';$('#successState').classList.remove('show');$('#simulate').style.display=payment.mode==='MOCK'?'block':'none';$('#modal').classList.add('show')}catch(e){alert(e.message||'创建支付失败')}finally{$('#submit').disabled=false;updateTotal()}};
function normalizeCards(d){if(Array.isArray(d.cards)&&d.cards.length)return d.cards;if(d.cardKey)return[{itemNo:1,cardKey:d.cardKey,licenseExpiresAt:d.licenseExpiresAt}];return[]}
function renderSuccessCards(cards){const root=$('#successKeys');root.innerHTML='';cards.forEach((c,i)=>{const div=document.createElement('div');div.className='keyitem';div.innerHTML=`<small>卡密 ${i+1}</small><div class="keyvalue">${c.cardKey}</div><button class="copy">复制卡密</button>`;div.querySelector('.copy').onclick=e=>copy(c.cardKey,e.currentTarget);root.appendChild(div)});$('#copyAll').onclick=()=>copy(cards.map(c=>c.cardKey).join('\n'),$('#copyAll'))}
$('#simulate').onclick=async()=>{if(!currentOrder)return;$('#simulate').disabled=true;try{const d=await json(`../orders/${encodeURIComponent(currentOrder.orderNo)}/mock-pay`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientToken:currentOrder.clientToken})});renderSuccessCards(normalizeCards(d));$('#payState').style.display='none';$('#successState').classList.add('show')}catch(e){alert(e.message||'支付失败')}finally{$('#simulate').disabled=false}};
$('#close').onclick=()=>$('#modal').classList.remove('show');
function legacyCopy(text){const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.left='-9999px';t.style.top='0';document.body.appendChild(t);t.focus();t.select();t.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy')}catch{}document.body.removeChild(t);return ok}
async function copy(v,b){const original=b.textContent;let ok=false;if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(v);ok=true}catch{}}if(!ok)ok=legacyCopy(v);b.textContent=ok?'已复制':'复制失败';setTimeout(()=>b.textContent=original,1200)}
$('#viewOrder').onclick=()=>{$('#modal').classList.remove('show');view(true);$('#queryPhone').value=$('#phone').value.trim();$('#querySubmit').click()};
function statusText(s){return s==='PAID'?'已支付':s==='CREATED'?'待支付':s==='EXPIRED'?'已过期':s||'--'}
function statusClass(s){return s==='PAID'?'paid':s==='CREATED'?'created':'expired'}
function renderOrders(orders){const root=$('#queryResult');root.innerHTML='';orders.forEach(o=>{const cards=normalizeCards(o),el=document.createElement('div');el.className='order';const keys=cards.length?`<div class="keyrow">${cards.map((c,i)=>`<div class="keyitem"><small>卡密 ${i+1}${c.licenseExpiresAt?' · 有效至 '+c.licenseExpiresAt:''}</small><div class="keyvalue">${c.cardKey}</div><button class="copy" data-index="${i}">复制卡密</button></div>`).join('')}<button class="copy copyall">复制全部卡密</button></div>`:'';el.innerHTML=`<div class="order-line"><span>订单号</span><b>${o.orderNo}</b></div><div class="order-line"><span>状态</span><span class="status ${statusClass(o.status)}">${statusText(o.status)}</span></div><div class="order-line"><span>数量</span><b>${o.quantity||1} 张</b></div><div class="order-line"><span>金额</span><b>¥${(Number(o.amountFen||0)/100).toFixed(2)}</b></div>${keys}`;el.querySelectorAll('.keyitem .copy').forEach(btn=>btn.onclick=e=>copy(cards[Number(e.currentTarget.dataset.index)].cardKey,e.currentTarget));const all=el.querySelector('.copyall');if(all)all.onclick=e=>copy(cards.map(c=>c.cardKey).join('\n'),e.currentTarget);root.appendChild(el)});root.classList.add('show')}
$('#querySubmit').onclick=async()=>{const phone=$('#queryPhone').value.trim();$('#queryError').classList.remove('show');$('#queryResult').classList.remove('show');if(!/^1\d{10}$/.test(phone)){const e=$('#queryError');e.textContent='请输入正确手机号';e.classList.add('show');return}try{const d=await json(`../orders/query?phone=${encodeURIComponent(phone)}`,{cache:'no-store'});if(!d.orders||!d.orders.length){const e=$('#queryError');e.textContent='未找到订单';e.classList.add('show');return}renderOrders(d.orders)}catch(err){const e=$('#queryError');e.textContent=err.message||'查询失败';e.classList.add('show')}};if(location.hash==='#orders')view(true);updateTotal();
</script>
</body></html>
