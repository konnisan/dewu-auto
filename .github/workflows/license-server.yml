name: License Server CI

on:
  push:
    paths:
      - 'license-server/**'
      - '.github/workflows/license-server.yml'
  pull_request:
    paths:
      - 'license-server/**'
      - '.github/workflows/license-server.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build license server
        working-directory: license-server
        run: mvn -B clean package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: dewu-license-server
          path: license-server/target/dewu-license-server.jar
